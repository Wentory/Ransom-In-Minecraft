plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = mod_version
group = mod_group_id
base { archivesName = 'ransom-fabric-26.2' }

loom {
    accessWidenerPath = file('src/main/resources/ransom_in_minecraft.accesswidener')
    mods {
        ransom_in_minecraft {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "com.terraformersmc:modmenu:${modmenu_version}"
}

sourceSets.main.resources.srcDir '../common/src/main/resources'
sourceSets.main.java.srcDir '../common/src/main/java'
sourceSets.test.java.srcDir '../common/src/test/java'
tasks.register('rulesTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wentory.ransom_in_minecraft.rules.RuleContractTest'
}
tasks.named('check') { dependsOn tasks.named('rulesTest') }
// The contract suite is a standalone main, run by rulesTest rather than JUnit.
tasks.named('test') { enabled = false }

def resourceVersion = mod_version
processResources {
    inputs.property 'version', resourceVersion
    filesMatching('fabric.mod.json') { expand version: resourceVersion }
}

tasks.withType(JavaCompile).configureEach { options.release = 25 }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

apply from: rootProject.file('gradle/collect-release.gradle')

sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
tasks.register('banishmentRenderTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wentory.ransom_in_minecraft.client.BanishmentSubmitCollectorTest'
}
tasks.named('check') { dependsOn tasks.named('banishmentRenderTest') }

tasks.register('stopMouseTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wentory.ransom_in_minecraft.client.StopMouseMovementTest'
}
tasks.named('check') { dependsOn tasks.named('stopMouseTest') }

tasks.register('stopHeldInputTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wentory.ransom_in_minecraft.client.StopHeldInputTest'
}
tasks.named('check') { dependsOn tasks.named('stopHeldInputTest') }

tasks.register('hijackSpeechTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wentory.ransom_in_minecraft.HijackChatCommandsTest'
}
tasks.named('check') { dependsOn tasks.named('hijackSpeechTest') }


tasks.register('encounterResultTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wentory.ransom_in_minecraft.network.RansomStatePayloadTest'
}

tasks.named('check') { dependsOn tasks.named('encounterResultTest') }
