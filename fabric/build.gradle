plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = mod_version
group = mod_group_id
base { archivesName = 'ransom-fabric-26.2' }

loom {
    accessWidenerPath = file('src/main/resources/ransom_in_minecraft.accesswidener')
    mods {
        ransom_in_minecraft {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "com.terraformersmc:modmenu:${modmenu_version}"
}

sourceSets.main.resources.srcDir '../common/src/main/resources'

def resourceVersion = mod_version
processResources {
    inputs.property 'version', resourceVersion
    filesMatching('fabric.mod.json') { expand version: resourceVersion }
}

tasks.withType(JavaCompile).configureEach { options.release = 25 }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
